  aria-labelledby="xpn-app-title" aria-describedby="xpn-app-desc">
  <title id="xpn-app-title">XPN</title>
  <desc id="xpn-app-desc">Знак XPN с платиновыми гранями и фиолетовым отражением на тёмном фоне.</desc>
  <style>@media (max-width:64px){.fine-detail{display:none}}</style>
