      <path d="M40 36L58 58L56.481 57.28L39.07 36Z"/>
      <path d="M46 58L34 43V41.847L46.346 57.28Z"/>
      <path d="M28 36L10 14L11.519 14.72L28.93 36Z"/>
    </g>
