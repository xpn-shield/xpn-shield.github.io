<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" fill="none">
  <title>Схема XPN с электрическими импульсами по дорожкам</title>
  <style>
    .trace {stroke:#8f6cb1;stroke-opacity:.48;stroke-width:1.15;stroke-linejoin:round}
    .current {stroke:#e2baff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 110;stroke-dashoffset:10;opacity:0;animation:current-flow 5s linear infinite}
    .die {stroke:#ba8ded;stroke-width:1;animation:core-signal 5s ease-in-out infinite}
    .indicator {fill:#d9b5ff;animation:core-signal 5s ease-in-out infinite}
    @keyframes current-flow {0%{stroke-dashoffset:10;opacity:0}8%{opacity:0}18%,76%{opacity:1}92%,100%{stroke-dashoffset:-100;opacity:0}}
    @keyframes core-signal {0%,100%{opacity:.35}45%,60%{opacity:.9}}
    @media(prefers-reduced-motion:reduce) {.current{animation:none;opacity:0}.die,.indicator{animation:none;opacity:.65}}
  </style>
