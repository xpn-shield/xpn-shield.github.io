  aria-labelledby="xpn-tg-title" aria-describedby="xpn-tg-desc">
  <title id="xpn-tg-title">XPN</title>
  <desc id="xpn-tg-desc">Знак XPN с платиновыми гранями и фиолетовым отражением на тёмном фоне.</desc>
  <style>@media (max-width:64px){.fine-detail{display:none}}</style>
  <defs>
